name: Tests

# On every pull request and merge to main:
# - code: type-checks everything and runs the code tests (npm test)
# - rules: runs the database rules tests (npm run test:rules) inside Firebase's local emulator, a
#   throwaway database that never touches the live project. The emulator needs Java, which is set
#   up here so no one has to install it on their own computer.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc -b
      - run: npm test

  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      # The emulator is a download of its own; keep it between runs
      - uses: actions/cache@v5
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package.json') }}
      - run: npm ci
      - run: npm run test:rules
