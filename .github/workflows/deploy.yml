name: Deploy

# On every merge to main: build the site and publish it to Firebase Hosting together with the
# database rules (firestore.rules), then the storage rules for uploaded photos and logos
# (storage.rules). Setup: docs/firebase-hosting-setup.md

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  firebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }} # optional
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Publish the site and the database rules
        run: >
          npx --yes firebase-tools@15.34.2 deploy
          --only hosting,firestore:rules
          --project "$PROJECT_ID"
          --message "${{ github.sha }}"
          --non-interactive
        env:
          PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      # Separate, so the site still goes out if Storage isn't set up (docs/firebase-hosting-setup.md).
      # The bucket is named outright, the same one the app uses: asked for the project's default
      # bucket, Firebase can answer that there's none even when the console shows it. firebase.json
      # itself can't name it, since the emulators then want a deploy target instead.
      - name: Publish the storage rules
        run: |
          jq --arg bucket "$BUCKET" '.storage = [{bucket: $bucket, rules: "storage.rules"}]' firebase.json > firebase.storage.json
          npx --yes firebase-tools@15.34.2 deploy \
            --only storage \
            --config firebase.storage.json \
            --project "$PROJECT_ID" \
            --message "${{ github.sha }}" \
            --non-interactive
        env:
          PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET || format('{0}.firebasestorage.app', secrets.VITE_FIREBASE_PROJECT_ID) }}
